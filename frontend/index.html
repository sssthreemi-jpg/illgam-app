<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>일감몰아주기 판정기</title>
  <style>body{font-family:Arial;margin:20px}label{display:block;margin-top:8px}</style>
</head>
<body>
  <h1>일감몰아주기 증여세 판정기</h1>
  <div id="auth">
    <h2>로그인</h2>
    <label>사용자: <input id="username" value="이지메디컴"></label>
    <label>비밀번호: <input id="password" type="password" value="demo"></label>
    <button id="login">로그인</button>
  </div>

  <div id="app" style="display:none">
    <h2>내 법인 정보</h2>
    <div id="mycompany"></div>
    <h3>판정 입력</h3>
    <label>법인: <input id="company" value="이지메디컴"></label>
    <label>세무조정후 영업이익: <input id="operating_income" value="1000000"></label>
    <label>법인세상당액: <input id="corporate_tax" value="0"></label>
    <label>총매출: <input id="total_sales" value="1000000"></label>
    <label>거래처 매출 JSON: <textarea id="related_sales" rows="4">{"대웅제약":900000}</textarea></label>
    <button id="evaluate">판정</button>
    <h3>결과</h3>
    <pre id="result"></pre>
  </div>

  <script src="/app.js"></script>
</body>
</html>
