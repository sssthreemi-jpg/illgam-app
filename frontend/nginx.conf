events {}
http {
  server {
    listen 80;
    location / {
      root /usr/share/nginx/html;
      index index.html;
    }
    location /api/ {
      # 특수관계자 매출 엑셀 업로드용. nginx 기본값은 1m 이라 그냥 두면 백엔드가
      # 5MB 를 허용해도 프록시가 먼저 413 으로 막는다(로컬 개발에서는 nginx 를
      # 거치지 않아 드러나지 않는다).
      #
      # backend/excel_import.py 의 MAX_UPLOAD_BYTES(5MB) 보다 일부러 크게 잡는다.
      # 같은 값으로 맞추면 5MB 부근 파일이 multipart 오버헤드 때문에 nginx 에서 먼저
      # 잘려, 백엔드가 주는 안내문 대신 nginx 의 413 HTML 이 나간다. 상한 판단은
      # 백엔드가 하고 nginx 는 통과시키는 쪽이 사용자에게 설명이 남는다.
      client_max_body_size 6m;
      proxy_pass http://backend:8000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
