services:
  backend:
    build:
      # 컨텍스트는 저장소 루트여야 한다 — backend 를 패키지로 복사해야 import 가 풀린다.
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      # 기밀 데이터는 이미지에 굽지 않고 런타임에만 붙인다.
      # 경로는 calc.DEFAULT_DATA_DIR(= <backend 패키지>/data)와 맞춰야 한다.
      - ./backend/data:/app/backend/data:ro
    # ADMIN_USERNAME / ADMIN_PASSWORD / JWT_SECRET 를 컨테이너에 전달한다.
    # (예전에는 JWT_SECRET 만 넘겨서 관리자 비밀번호가 항상 기본값 'adminpass' 였다.)
    # 파일이 없으면 compose 가 기동을 거부한다. scripts/setup.ps1 이 생성하며
    # 양식은 backend/.env.example 참조.
    env_file:
      - backend/.env
    ports:
      - 8000:8000
  frontend:
    image: nginx:stable
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 80:80
